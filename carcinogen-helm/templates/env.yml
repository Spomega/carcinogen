{{- define "env.vars" }}
env:
  - name: APP_ENV
    value: {{ .valueRoot.Values.env.APP_ENV }}
  - name: DB_HOST
    value: {{ .valueRoot.Values.env.DB_HOST }}
  - name: DB_DATABASE
    value: {{ .valueRoot.Values.env.DB_DATABASE }}
  - name: DB_USERNAME
    value: {{ .valueRoot.Values.env.DB_USERNAME }}
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: {{ .valueRoot.Values.env.DB_SECRETS }}
        key: {{ .valueRoot.Values.env.DB_PASSWORD }}



 {{- end }}
{{- define "env.vars" }}
env:
  - name: APP_ENV
    value: {{ .valuesRoot.Values.env.APP_ENV }}
  - name: APP_SECRET
    value: {{ .valuesRoot.Values.env.APP_SECRET }}
  - name: DB_HOST
    value: {{ .valuesRoot.Values.env.DB_HOST }}
  - name: DB_DATABASE
    value: {{ .valuesRoot.Values.env.DB_DATABASE }}
  - name: DB_USERNAME
    value: {{ .valuesRoot.Values.env.DB_USERNAME }}
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: {{ .valuesRoot.Values.env.DB_SECRETS }}
        key: {{ .valuesRoot.Values.env.DB_PASSWORD }}

 {{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{.Chart.Name}}-config
  labels:
    name: {{.Chart.Name}}
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  .env: |-
    APP_ENV= '%env(string:APP_ENV)%'
    DATABASE_URL= mysql://'%env(string:DB_USERNAME)%':'%env(string:DB_PASSWORD)%'@'%env(string:DB_HOST)%'/'%env(string:DB_DATABASE)%'?serverVersion=8.0&charset=utf8mb4



